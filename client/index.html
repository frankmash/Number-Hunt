<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Number Hunt — Multiplayer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>
</head>
<body>

  <!-- LOBBY -->
  <div id="lobbyScreen" class="screen">
    <div class="setup-card">
      <h1>Number Hunt</h1>
      <p class="subtitle">2-Player Race</p>

      <div class="name-input">
        <input type="text" id="playerName" placeholder="Your name" maxlength="16" autocomplete="off">
      </div>

      <div class="lobby-actions">
        <button id="createRoomBtn" class="primary-btn">Create Room</button>
        <div class="or-divider">or</div>
        <div class="join-row">
          <input type="text" id="roomCodeInput" placeholder="Room code" maxlength="6" autocomplete="off">
          <button id="joinRoomBtn" class="secondary-btn">Join</button>
        </div>
      </div>

      <p class="hint" id="lobbyHint">Create a room and share the code with a friend</p>
    </div>
  </div>

  <!-- WAITING -->
  <div id="waitingScreen" class="screen hidden">
    <div class="setup-card">
      <h1>Room <span id="displayRoomCode"></span></h1>
      <p class="waiting-status" id="waitingStatus">Waiting for opponent...</p>

      <div class="players-list" id="playersList"></div>

      <div id="hostControls" class="hidden">
        <p class="level-label">Numbers</p>
        <div class="number-input">
          <input type="number" id="maxNumber" min="10" max="400" value="50">
        </div>
        <p class="max-hint" id="maxHint">Up to 400 numbers</p>

        <p class="level-label">Difficulty</p>
        <div class="level-select" id="levelSelect">
          <button type="button" class="level-btn active" data-level="medium">Medium</button>
          <button type="button" class="level-btn" data-level="hard">Hard</button>
        </div>

        <button id="startGameBtn" class="primary-btn" disabled>Start Game</button>
      </div>

      <button id="leaveRoomBtn" class="text-btn">Leave Room</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="gameScreen" class="game-screen hidden">
    <div class="top-bar">
      <div class="target-block">
        <span class="label">FIND</span>
        <strong id="targetNumber">?</strong>
      </div>

      <div class="scores-block">
        <div class="score-item" id="scoreP1">
          <span class="score-name" id="nameP1">P1</span>
          <span class="score-value" id="scoreValueP1">0</span>
        </div>
        <div class="score-divider">:</div>
        <div class="score-item" id="scoreP2">
          <span class="score-name" id="nameP2">P2</span>
          <span class="score-value" id="scoreValueP2">0</span>
        </div>
      </div>

      <div class="top-bar-right">
        <div class="stats">
          <span id="foundCount">0</span>/<span id="totalCount">0</span>
        </div>
        <button id="muteBtn" class="mute-btn">🔊</button>
      </div>
    </div>

    <div class="book">
      <div class="page left-page" id="leftPage"></div>
      <div class="book-spine"></div>
      <div class="page right-page" id="rightPage"></div>
    </div>
  </div>

  <!-- FINISHED -->
  <div id="finishedOverlay" class="finished hidden">
    <div>
      <h1 id="winnerTitle">Finished!</h1>
      <p id="finalScores"></p>
      <div class="finished-actions">
        <button id="playAgainBtn" class="primary-btn">Play Again</button>
        <button id="backLobbyBtn" class="text-btn">Back to Lobby</button>
      </div>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
